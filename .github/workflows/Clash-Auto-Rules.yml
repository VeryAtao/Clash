# 阿涛Atao的「Surge」上游同步规则
# 版本：1.1
# 日期：2026.11.15
# 作者：https://github.com/VeryAtao/Surge

name: Auto-Clash-Rules

# 触发器配置
on:
  schedule:
	# 定时任务：北京时间每天 06:17 执行
	- cron: '17 22 * * *'
  # 允许手动触发
  workflow_dispatch:

# 权限配置
permissions:
  contents: write

jobs:
  update-rules:
	runs-on: ubuntu-latest
	
	# 强制所有 JavaScript Actions 使用 Node.js 24
	env:
	  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
	  
	steps:
	  # 步骤 1：检出代码
	  - name: Checkout Repository
		uses: actions/checkout@v4

	  # 步骤 2：下载、清洗、合并去重、统计并归档
	  - name: Download, Merge and Filter Rules
		run: |
		  # 创建输出目录及手动规则存储目录
		  mkdir -p Rules/Manual
		  
		  # 获取北京时间
		  UPDATE_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
		  
		  # 1. 定义标准处理函数 (用于 1对1 的规则同步)
		  
		  process_rule() {
			local source_url=$1
			local target_name=$2
			local display_name=$3

			local target_path="Rules/$target_name"
			local filename_no_ext="${target_name%.*}"
			local manual_file="Rules/Manual/${filename_no_ext}.txt"
			local exclude_file="Rules/Manual/${filename_no_ext}.exclude.txt"

			local upstream_temp=$(mktemp)
			local manual_temp=$(mktemp)
			local merged_temp=$(mktemp)

			echo "======================================"
			echo "开始处理：$target_name"
			echo "上游地址：$source_url"
			echo "手动文件：$manual_file"

			# A. 下载上游规则
			if ! curl -fsSL --connect-timeout 15 --max-time 120 \
			  "$source_url" -o "$upstream_temp"; then
			  echo "错误：上游文件下载失败，保留原有文件：$target_path"
			  rm -f "$upstream_temp" "$manual_temp" "$merged_temp"
			  return 1
			fi

			if [ ! -s "$upstream_temp" ]; then
			  echo "错误：上游文件为空，保留原有文件：$target_path"
			  rm -f "$upstream_temp" "$manual_temp" "$merged_temp"
			  return 1
			fi

			# B. 清洗上游规则
			sed 's/\r$//' "$upstream_temp" |
			  grep -v '^#' |
			  grep -v '^[[:space:]]*$' > "${upstream_temp}.clean"

			# C. 应用上游排除规则
			if [ -s "$exclude_file" ]; then
			  grep -vFf "$exclude_file" \
				"${upstream_temp}.clean" > "${upstream_temp}.filtered" || true
			  mv "${upstream_temp}.filtered" "${upstream_temp}.clean"
			fi

			# D. 读取同名手动规则
			if [ -f "$manual_file" ]; then
			  sed 's/\r$//' "$manual_file" > "$manual_temp"
			  echo "发现手动规则：$manual_file"
			else
			  : > "$manual_temp"
			  echo "没有同名手动规则文件"
			fi

			# E. 合并：手动规则 + 上游规则
			{
			  if [ -s "$manual_temp" ]; then
				echo "# ======= 手动维护规则 ========"
				cat "$manual_temp"
				echo ""
			  fi

			  echo "# ======= 上游同步规则 ========"
			  cat "${upstream_temp}.clean"
			} > "$merged_temp"

			# F. 去重，保留注释和规则顺序
			awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' \
			  "$merged_temp" > "${merged_temp}.dedup"

			# G. 统计规则数量
			local rule_count
			rule_count=$(grep -v '^#' "${merged_temp}.dedup" |
			  grep -v '^[[:space:]]*$' | wc -l)

			# H. 生成最终文件
			{
			  echo "# NAME: $display_name"
			  echo "# AUTHOR: VeryAtao"
			  echo "# REPO: https://github.com/VeryAtao/Clash"
			  echo "# UPDATED: $UPDATE_TIME"
			  echo "# TOTAL: $rule_count"
			  echo ""
			  cat "${merged_temp}.dedup"
			} > "$target_path"

			echo "合并完成：$target_path"
			echo "手动规则文件：$manual_file"
			echo "最终规则数量：$rule_count"

			rm -f "$upstream_temp" "$manual_temp" \
			  "$merged_temp" "${upstream_temp}.clean" \
			  "${merged_temp}.dedup"

		  }
		  
		  # --- 第一部分：常规规则同步 ---
		  # Loyalsoldier 仓库
		  URL_PROXY="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"
		  process_rule "$URL_PROXY" "ChinaCIDR.yaml" "阿涛Atao的「ChinaCIDR」规则"

		  URL_PROXY="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
		  process_rule "$URL_PROXY" "China.yaml" "阿涛Atao的「China」规则"

		  # Sukka 仓库
		  URL_PROXY="https://ruleset.skk.moe/Clash/ip/telegram.txt"
		  process_rule "$URL_PROXY" "Telegram.yaml" "阿涛Atao的「Telegram」规则"

		  URL_PROXY="https://ruleset.skk.moe/Clash/non_ip/ai.txt"
		  process_rule "$URL_PROXY" "AIGC.yaml" "阿涛Atao的「AIGC」规则"

		  # MagicRule 仓库
		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Apple_classical_0fa29647e779e764.yaml"
		  process_rule "$URL_PROXY" "Apple.yaml" "阿涛Atao的「Apple」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Google_classical_fe2edb12daf1b32f.yaml"
		  process_rule "$URL_PROXY" "Google.yaml" "阿涛Atao的「Google」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Instagram_classical_8f2bea3580d2acf2.yaml"
		  process_rule "$URL_PROXY" "Instagram.yaml" "阿涛Atao的「Instagram」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Facebook_classical_041e2b1a05aace8f.yaml"
		  process_rule "$URL_PROXY" "Facebook.yaml" "阿涛Atao的「Facebook」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Microsoft_classical_e67099aa280f921f.yaml"
		  process_rule "$URL_PROXY" "Microsoft.yaml" "阿涛Atao的「Microsoft」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/YouTube_classical_59b6d0fe3b15c19e.yaml"
		  process_rule "$URL_PROXY" "YouTube.yaml" "阿涛Atao的「YouTube」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Netflix_classical_c2f68b0a92395ef4.yaml"
		  process_rule "$URL_PROXY" "Netflix.yaml" "阿涛Atao的「Netflix」规则"

		  URL_PROXY="https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney_No_Resolve.yaml"
		  process_rule "$URL_PROXY" "Disney.yaml" "阿涛Atao的「Disney」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Spotify_classical_822ce41d873a2ee4.yaml"
		  process_rule "$URL_PROXY" "Spotify.yaml" "阿涛Atao的「Spotify」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/TikTok_classical_c510421d706b99d3.yaml"
		  process_rule "$URL_PROXY" "TikTok.yaml" "阿涛Atao的「TikTok」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/BiliBili_classical_e094628621c39bfc.yaml"
		  process_rule "$URL_PROXY" "BiliBili.yaml" "阿涛Atao的「BiliBili」规则" 

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/ChinaMedia_classical_5eda3320a55c6422.yaml"
		  process_rule "$URL_PROXY" "ChinaMedia.yaml" "阿涛Atao的「ChinaMedia」规则" 
		  
		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/GlobalMedia_classical_f0880cec2c24ebd6.yaml"
		  process_rule "$URL_PROXY" "GlobalMedia.yaml" "阿涛Atao的「GlobalMedia」规则" 

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/PayPal_classical_3d035a8c84b7c305.yaml"
		  process_rule "$URL_PROXY" "PayPal.yaml" "阿涛Atao的「PayPal」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Whatsapp_classical_cd2dafda3f58a9b4.yaml"
		  process_rule "$URL_PROXY" "Whatsapp.yaml" "阿涛Atao的「Whatsapp」规则"

		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Lan_classical_24817c9e646b9514.yaml"
		  process_rule "$URL_PROXY" "LAN.yaml" "阿涛Atao的「LAN」规则"
		  
		  URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/GlobalGame_classical_f8d067b0c35d9641.yaml"
		  process_rule "$URL_PROXY" "Game.yaml" "阿涛Atao的「Game」规则"

		  # --- 第二部分：Proxy.yaml 聚合处理 ---
		  PROXY_TARGET="Rules/Proxy.yaml"
		  PROXY_EXCLUDE="Rules/Manual/Proxy.exclude.txt"
		  PROXY_MANUAL="Rules/Manual/Proxy.txt"
		  proxy_temp=$(mktemp)
		  
		  # A. Proxy 手动规则
		  if [ -f "$PROXY_MANUAL" ] && [ -s "$PROXY_MANUAL" ]; then
			echo "# ======= 手动维护规则 ========" >> "$proxy_temp"
			awk 'tolower($0) !~ /payload:/ && $0 !~ /^[[:space:]]*#/ && NF' "$PROXY_MANUAL" | sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//g; s/['\"]?[[:space:]]*$//g" >> "$proxy_temp"
		  fi
		  
		  # B. Proxy 聚合源
		  PROXY_SUBS=(
			"Telegram|https://ruleset.skk.moe/Clash/non_ip/telegram.txt"
			"Proxy|https://magicrule.pages.dev/data/_shared/artifacts/Global_classical_84d7c926159da35f.yaml"
		  )
		  
		  for sub in "${PROXY_SUBS[@]}"; do
			name="${sub%%|*}"
			url="${sub#*|}"
			echo "# ======= $name ========" >> "$proxy_temp"
			temp_sub=$(mktemp)
			if curl -fsL "$url" | awk 'tolower($0) !~ /payload:/ && $0 !~ /^[[:space:]]*#/ && NF' | sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//g; s/['\"]?[[:space:]]*$//g" > "$temp_sub"; then
			  if [ -f "$PROXY_EXCLUDE" ] && [ -s "$PROXY_EXCLUDE" ]; then
				grep -vFf "$PROXY_EXCLUDE" "$temp_sub" >> "$proxy_temp" || true
			  else
				cat "$temp_sub" >> "$proxy_temp"
			  fi
			else
			  echo "Warning: Failed to download $url"
			fi
			rm -f "$temp_sub"
		  done
		  
		  # C. 合并去重
		  sed -i 's/\r//g' "$proxy_temp"
		  awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' "$proxy_temp" > "${proxy_temp}.tmp" && mv "${proxy_temp}.tmp" "$proxy_temp"

		  # D. 统计 Proxy 规则数
		  proxy_count=$(awk '$0 !~ /^[[:space:]]*#/ && NF' "$proxy_temp" | wc -l)
		  
		  # E. 写入 Proxy.yaml 最终文件 (按 YAML 格式化输出)
		  echo "# NAME: 阿涛Atao的「Proxy」规则" > "$PROXY_TARGET"
		  echo "# AUTHOR: VeryAtao" >> "$PROXY_TARGET"
		  echo "# REPO: https://github.com/VeryAtao/Clash" >> "$PROXY_TARGET"
		  echo "# UPDATED: $UPDATE_TIME" >> "$PROXY_TARGET"
		  echo "# TOTAL: $proxy_count" >> "$PROXY_TARGET"
		  echo "" >> "$PROXY_TARGET"
		  echo "payload:" >> "$PROXY_TARGET"
		  
		  while IFS= read -r line || [ -n "$line" ]; do
			if [[ "$line" =~ ^# ]]; then
			  echo "  $line" >> "$PROXY_TARGET"
			elif [ -z "$line" ]; then
			  echo "" >> "$PROXY_TARGET"
			else
			  echo "  - $line" >> "$PROXY_TARGET"
			fi
		  done < "$proxy_temp"
		  rm -f "$proxy_temp"

	  # 步骤 3：Git 提交与推送到远程仓库
	  - name: Commit and Push Changes
		run: |
		  git config --local user.email "github-actions[bot]@users.noreply.github.com"
		  git config --local user.name "github-actions[bot]"
		  git add Rules/
		  if ! git diff --staged --quiet; then
			COMMIT_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
			git commit -m "$COMMIT_TIME Update"
			git push
		  fi
