# 阿涛Atao的「Clash」上游同步规则
# 版本：2.0
# 日期：2026.11.24
# 作者：https://github.com/VeryAtao/Clash

name: Auto-Clash-Rules

# 触发器配置
on:
  schedule:
    # 北京时间每天 06:17 执行
    - cron: '17 22 * * *'
  workflow_dispatch:

# 权限配置
permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 步骤 1：检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤 2：下载、合并、去重及生成规则
      - name: Download, Merge and Filter Rules
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p Rules/Manual

          UPDATE_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")

          # ==========================================
          # 通用规则处理函数
          # ==========================================
          process_rule() {
            local source_url="$1"
            local target_name="$2"
            local display_name="$3"

            local target_path="Rules/$target_name"
            local filename_no_ext="${target_name%.*}"

            local manual_file="Rules/Manual/${filename_no_ext}.txt"
            local exclude_file="Rules/Manual/${filename_no_ext}.exclude.txt"

            local temp_body
            local temp_upstream
            local temp_filtered

            temp_body=$(mktemp)
            temp_upstream=$(mktemp)
            temp_filtered=$(mktemp)

            # A. 处理手动规则
            if [ -f "$manual_file" ]; then
              sed 's/\r//g' "$manual_file" |
              awk '
                tolower($0) !~ /^[[:space:]]*payload:/ &&
                $0 !~ /^[[:space:]]*#/ &&
                NF
              ' |
              sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//; s/['\"]?[[:space:]]*$//" \
              > "$temp_body"

              if [ -s "$temp_body" ]; then
                sed -i '1i# ======= 手动维护规则 ========' "$temp_body"
              fi
            fi

            # B. 下载上游规则
            echo "# ======= 上游同步规则 ========" >> "$temp_body"

            if ! curl -fsSL --retry 3 --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$source_url" -o "$temp_upstream"; then

              echo "::warning::上游下载失败：$source_url"

              rm -f "$temp_body" "$temp_upstream" "$temp_filtered"
              return 1
            fi

            # C. 清洗上游规则
            sed 's/\r//g' "$temp_upstream" |
            awk '
              tolower($0) !~ /^[[:space:]]*payload:/ &&
              $0 !~ /^[[:space:]]*#/ &&
              NF
            ' |
            sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//; s/['\"]?[[:space:]]*$//" \
            > "$temp_filtered"

            # D. 应用排除规则
            if [ -f "$exclude_file" ] && [ -s "$exclude_file" ]; then
              local valid_excludes
              valid_excludes=$(sed 's/\r//g' "$exclude_file" |
                sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d')

              if [ -n "$valid_excludes" ]; then
                grep -vFf <(printf '%s\n' "$valid_excludes") \
                  "$temp_filtered" >> "$temp_body" || true
              else
                cat "$temp_filtered" >> "$temp_body"
              fi
            else
              cat "$temp_filtered" >> "$temp_body"
            fi

            # E. 合并去重，保留首次出现顺序
            awk '
              /^#/ || /^[[:space:]]*$/ {
                print
                next
              }
              !seen[$0]++ {
                print
              }
            ' "$temp_body" > "${temp_body}.tmp"

            mv "${temp_body}.tmp" "$temp_body"

            # F. 统计规则数量
            local rule_count
            rule_count=$(awk '$0 !~ /^[[:space:]]*#/ && NF' "$temp_body" | wc -l)

            # G. 生成 YAML
            {
              echo "# NAME: $display_name"
              echo "# AUTHOR: VeryAtao"
              echo "# REPO: https://github.com/VeryAtao/Clash"
              echo "# UPDATED: $UPDATE_TIME"
              echo "# TOTAL: $rule_count"
              echo ""
              echo "payload:"

              awk '
                /^#/ {
                  print "  " $0
                  next
                }
                /^[[:space:]]*$/ {
                  next
                }
                {
                  print "  - " $0
                }
              ' "$temp_body"

            } > "$target_path"

            rm -f "$temp_body" "$temp_upstream" "$temp_filtered"

            echo "完成：$target_path，共 $rule_count 条规则"
          }

          # ==========================================
          # 第一部分：常规规则同步
          # ==========================================

          # Loyalsoldier
          process_rule \
            "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt" \
            "ChinaCIDR.yaml" "阿涛Atao的「ChinaCIDR」规则"

          process_rule \
            "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt" \
            "China.yaml" "阿涛Atao的「China」规则"

          # Sukka
          process_rule \
            "https://ruleset.skk.moe/Clash/ip/telegram.txt" \
            "Telegram.yaml" "阿涛Atao的「Telegram」规则"

          process_rule \
            "https://ruleset.skk.moe/Clash/non_ip/ai.txt" \
            "AIGC.yaml" "阿涛Atao的「AIGC」规则"

          # MagicRule
          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/GoogleFCM_classical_781159f701cc3dbb.yaml" \
            "GoogleFCM.yaml" "阿涛Atao的「GoogleFCM」规则"

          process_rule \
            "https://rule2-ze9.pages.dev/data/_shared/artifacts/Apple_APNs_classical_2e90bebf36120c7f.yaml" \
            "AppleAPNs.yaml" "阿涛Atao的「AppleAPNs」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/GitHub_classical_66f5a463ca33f147.yaml" \
            "GitHub.yaml" "阿涛Atao的「GitHub」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Apple_classical_0fa29647e779e764.yaml" \
            "Apple.yaml" "阿涛Atao的「Apple」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Google_classical_fe2edb12daf1b32f.yaml" \
            "Google.yaml" "阿涛Atao的「Google」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Instagram_classical_8f2bea3580d2acf2.yaml" \
            "Instagram.yaml" "阿涛Atao的「Instagram」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Facebook_classical_041e2b1a05aace8f.yaml" \
            "Facebook.yaml" "阿涛Atao的「Facebook」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Microsoft_classical_e67099aa280f921f.yaml" \
            "Microsoft.yaml" "阿涛Atao的「Microsoft」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/YouTube_classical_59b6d0fe3b15c19e.yaml" \
            "YouTube.yaml" "阿涛Atao的「YouTube」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Netflix_classical_c2f68b0a92395ef4.yaml" \
            "Netflix.yaml" "阿涛Atao的「Netflix」规则"

          process_rule \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney_No_Resolve.yaml" \
            "Disney.yaml" "阿涛Atao的「Disney」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Spotify_classical_822ce41d873a2ee4.yaml" \
            "Spotify.yaml" "阿涛Atao的「Spotify」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/TikTok_classical_c510421d706b99d3.yaml" \
            "TikTok.yaml" "阿涛Atao的「TikTok」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/BiliBili_classical_e094628621c39bfc.yaml" \
            "BiliBili.yaml" "阿涛Atao的「BiliBili」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/ChinaMedia_classical_5eda3320a55c6422.yaml" \
            "ChinaMedia.yaml" "阿涛Atao的「ChinaMedia」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Twitter_classical_d405159ccf6c8682.yaml" \
            "Twitter.yaml" "阿涛Atao的「Twitter」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/GlobalMedia_classical_f0880cec2c24ebd6.yaml" \
            "GlobalMedia.yaml" "阿涛Atao的「GlobalMedia」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/PayPal_classical_3d035a8c84b7c305.yaml" \
            "PayPal.yaml" "阿涛Atao的「PayPal」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Whatsapp_classical_cd2dafda3f58a9b4.yaml" \
            "Whatsapp.yaml" "阿涛Atao的「Whatsapp」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/Lan_classical_24817c9e646b9514.yaml" \
            "LAN.yaml" "阿涛Atao的「LAN」规则"

          process_rule \
            "https://magicrule.pages.dev/data/_shared/artifacts/GlobalGame_classical_f8d067b0c35d9641.yaml" \
            "Game.yaml" "阿涛Atao的「Game」规则"

          # ==========================================
          # 第二部分：Proxy 聚合规则
          # ==========================================

          PROXY_TARGET="Rules/Proxy.yaml"
          PROXY_EXCLUDE="Rules/Manual/Proxy.exclude.txt"
          PROXY_MANUAL="Rules/Manual/Proxy.txt"

          proxy_temp=$(mktemp)
          proxy_upstream=$(mktemp)
          proxy_filtered=$(mktemp)

          # A. 手动规则
          if [ -f "$PROXY_MANUAL" ]; then
            sed 's/\r//g' "$PROXY_MANUAL" |
            awk '
              tolower($0) !~ /^[[:space:]]*payload:/ &&
              $0 !~ /^[[:space:]]*#/ &&
              NF
            ' |
            sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//; s/['\"]?[[:space:]]*$//" \
            > "$proxy_temp"

            if [ -s "$proxy_temp" ]; then
              sed -i '1i# ======= 手动维护规则 ========' "$proxy_temp"
            fi
          fi

          # B. 上游规则源
          PROXY_SUBS=(
            "Telegram|https://ruleset.skk.moe/Clash/non_ip/telegram.txt"
            "Proxy|https://magicrule.pages.dev/data/_shared/artifacts/Global_classical_84d7c926159da35f.yaml"
          )

          for sub in "${PROXY_SUBS[@]}"; do
            name="${sub%%|*}"
            url="${sub#*|}"

            echo "# ======= $name ========" >> "$proxy_temp"

            : > "$proxy_upstream"

            if ! curl -fsSL --retry 3 --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$url" -o "$proxy_upstream"; then

              echo "::warning::Proxy 上游下载失败：$url"
              continue
            fi

            sed 's/\r//g' "$proxy_upstream" |
            awk '
              tolower($0) !~ /^[[:space:]]*payload:/ &&
              $0 !~ /^[[:space:]]*#/ &&
              NF
            ' |
            sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//; s/['\"]?[[:space:]]*$//" \
            > "$proxy_filtered"

            if [ -f "$PROXY_EXCLUDE" ] && [ -s "$PROXY_EXCLUDE" ]; then
              valid_excludes=$(sed 's/\r//g' "$PROXY_EXCLUDE" |
                sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d')

              if [ -n "$valid_excludes" ]; then
                grep -vFf <(printf '%s\n' "$valid_excludes") \
                  "$proxy_filtered" >> "$proxy_temp" || true
              else
                cat "$proxy_filtered" >> "$proxy_temp"
              fi
            else
              cat "$proxy_filtered" >> "$proxy_temp"
            fi
          done

          # C. 去重
          awk '
            /^#/ || /^[[:space:]]*$/ {
              print
              next
            }
            !seen[$0]++ {
              print
            }
          ' "$proxy_temp" > "${proxy_temp}.tmp"

          mv "${proxy_temp}.tmp" "$proxy_temp"

          # D. 统计
          proxy_count=$(awk '$0 !~ /^[[:space:]]*#/ && NF' "$proxy_temp" | wc -l)

          # E. 生成 Proxy.yaml
          {
            echo "# NAME: 阿涛Atao的「Proxy」规则"
            echo "# AUTHOR: VeryAtao"
            echo "# REPO: https://github.com/VeryAtao/Clash"
            echo "# UPDATED: $UPDATE_TIME"
            echo "# TOTAL: $proxy_count"
            echo ""
            echo "payload:"

            awk '
              /^#/ {
                print "  " $0
                next
              }
              /^[[:space:]]*$/ {
                next
              }
              {
                print "  - " $0
              }
            ' "$proxy_temp"

          } > "$PROXY_TARGET"

          rm -f "$proxy_temp" "$proxy_upstream" "$proxy_filtered"

          echo "Proxy 规则处理完成，共 $proxy_count 条规则"

      # 步骤 3：提交与推送
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Rules/

          if ! git diff --staged --quiet; then
            COMMIT_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
            git commit -m "$COMMIT_TIME Update"
            git push
          else
            echo "规则没有变化，无需提交"
          fi
```
